openapi: 3.0.3
info:
  title: TransBooking BF API
  version: 1.0.0
  description: API de la plateforme SaaS de gestion du transport interurbain au Burkina
    Faso (réservations, colis, paiements Mobile Money, mode hors ligne).
paths:
  /api/v1/agent/bookings/:
    post:
      operationId: v1_agent_bookings_create
      description: |-
        Enregistrement et recherche de billets au guichet.

        Recherche par `ticket_number` (jamais par id sequentiel expose).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingCreate'
          description: ''
  /api/v1/agent/bookings/{ticket_number}/:
    get:
      operationId: v1_agent_bookings_retrieve
      description: |-
        Enregistrement et recherche de billets au guichet.

        Recherche par `ticket_number` (jamais par id sequentiel expose).
      parameters:
      - in: path
        name: ticket_number
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/v1/agent/bookings/{ticket_number}/cancel/:
    post:
      operationId: v1_agent_bookings_cancel_create
      description: |-
        Enregistrement et recherche de billets au guichet.

        Recherche par `ticket_number` (jamais par id sequentiel expose).
      summary: Annuler un billet au guichet
      parameters:
      - in: path
        name: ticket_number
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingCancel'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
        '404':
          description: Billet inconnu ou appartenant a une autre compagnie.
        '409':
          description: 'Billet deja embarque ou rembourse : annulation refusee.'
  /api/v1/agent/bookings/{ticket_number}/print/:
    post:
      operationId: v1_agent_bookings_print_create
      description: |-
        Enregistrement et recherche de billets au guichet.

        Recherche par `ticket_number` (jamais par id sequentiel expose).
      summary: Marquer un billet imprime et recuperer le payload d'impression
      parameters:
      - in: path
        name: ticket_number
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - agent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPrint'
          description: ''
        '404':
          description: Billet inconnu ou appartenant a une autre compagnie.
  /api/v1/agent/dashboard/:
    get:
      operationId: v1_agent_dashboard_retrieve
      description: GET /api/v1/agent/dashboard/ — tableau de bord de l'agent.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDashboard'
          description: ''
  /api/v1/agent/offline-data/:
    get:
      operationId: v1_agent_offline_data_retrieve
      description: |-
        GET /api/v1/agent/offline-data/ — paquet de travail hors ligne du jour.

        Renvoie les voyages du jour de la gare/vehicule de l'agent, les reservations
        associees et les colis arrives en attente de remise.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOfflineData'
          description: ''
  /api/v1/agent/parcels/:
    post:
      operationId: v1_agent_parcels_create
      description: Enregistrement et notification de colis au guichet.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentParcelCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentParcelCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentParcelCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelRead'
          description: ''
  /api/v1/agent/parcels/{id}/:
    get:
      operationId: v1_agent_parcels_retrieve
      description: Enregistrement et notification de colis au guichet.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelRead'
          description: ''
  /api/v1/agent/parcels/{id}/notify/:
    post:
      operationId: v1_agent_parcels_notify_create
      description: Envoie un SMS au destinataire ou enregistre un appel manuel.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelRead'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParcelRead'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParcelRead'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelRead'
          description: ''
  /api/v1/agent/parcels/arrivals/:
    get:
      operationId: v1_agent_parcels_arrivals_retrieve
      description: Colis arrives a la gare de l'agent, en attente de notification.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelRead'
          description: ''
  /api/v1/agent/payments/:
    post:
      operationId: v1_agent_payments_create
      description: |-
        POST /agent/payments/ — encaissement guichet (especes ou Mobile Money).

        Especes : l'agent initie et confirme en une etape. Mobile Money : le meme
        flux OTP que le voyageur (le paiement revient `otp_required`, le client
        confirme avec le code recu via `/payments/{id}/verify-otp/`).
      summary: Encaisser une reservation au guichet
      tags:
      - agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPayment'
            examples:
              Especes:
                value:
                  booking_id: 42
                  method: cash
              MobileMoney(fluxOTP):
                value:
                  booking_id: 42
                  method: orange_money
                  phone: '+22670000001'
                summary: Mobile Money (flux OTP)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentPayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentPayment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRead'
          description: ''
        '400':
          description: Moyen hors perimetre ou numero du payeur manquant.
        '404':
          description: Reservation hors de la compagnie de l'agent.
  /api/v1/agent/scan/:
    post:
      operationId: v1_agent_scan_create
      description: Scanne un QR code et renvoie le statut du billet avec code couleur.
      summary: Scanner un QR code et valider le billet
      tags:
      - agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
          description: ''
        '400':
          description: 'Champ requis manquant : qr_data ou ticket_number.'
        '404':
          description: Billet introuvable (ou hors de la compagnie du controleur).
  /api/v1/agent/scan/history/:
    get:
      operationId: v1_agent_scan_history_list
      description: GET /agent/scan/history/ — 50 derniers scans de l'agent, horodates.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - agent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScanLogList'
          description: ''
  /api/v1/agent/sync/:
    post:
      operationId: v1_agent_sync_create
      description: |-
        POST /api/v1/agent/sync/ — synchronise les donnees hors ligne de l'agent.

        Recoit un lot (`bookings`, `parcels`, `validations`) et l'integre dans une
        transaction atomique unique. Les conflits de siege sont resolus
        automatiquement (cf. business_rules.md §6).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPayload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncPayload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncPayload'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
          description: ''
  /api/v1/agent/sync/conflicts/:
    get:
      operationId: v1_agent_sync_conflicts_retrieve
      description: GET /api/v1/agent/sync/conflicts/ — conflits resolus a la derniere
        sync.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncConflict'
          description: ''
  /api/v1/agent/sync/logs/:
    get:
      operationId: v1_agent_sync_logs_list
      description: GET /api/v1/agent/sync/logs/ — historique des synchronisations.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSyncLogList'
          description: ''
  /api/v1/agent/trips/{trip_id}/boarding/{booking_id}/:
    post:
      operationId: v1_agent_trips_boarding_create
      description: POST /agent/trips/{id}/boarding/{booking_id}/ — cocher un passager.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      - in: path
        name: trip_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardingValidation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardingValidation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardingValidation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingValidation'
          description: ''
  /api/v1/agent/trips/{trip_id}/boarding/all/:
    post:
      operationId: v1_agent_trips_boarding_all_create
      description: POST /agent/trips/{id}/boarding/all/ — embarquer tous les payes.
      parameters:
      - in: path
        name: trip_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardingValidation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardingValidation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardingValidation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingValidation'
          description: ''
  /api/v1/agent/trips/{trip_id}/boarding/validate/:
    post:
      operationId: v1_agent_trips_boarding_validate_create
      description: POST /agent/trips/{id}/boarding/validate/ — verrouille l'embarquement.
      summary: Verrouiller l'embarquement et recuperer le recapitulatif
      parameters:
      - in: path
        name: trip_id
        schema:
          type: integer
        required: true
      tags:
      - agent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingValidationSummary'
          description: ''
  /api/v1/agent/trips/{trip_id}/delay/:
    post:
      operationId: v1_agent_trips_delay_create
      description: |-
        POST /api/v1/agent/trips/{id}/delay/ — reporter un voyage de N minutes.

        Ouvert a l'agent guichet, au controleur et au company admin du perimetre
        du voyage (isolation par compagnie, cf. requetes agent module §2).
      parameters:
      - in: path
        name: trip_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripDelay'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TripDelay'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TripDelay'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDelay'
          description: ''
  /api/v1/agent/trips/{trip_id}/passenger-list/:
    get:
      operationId: v1_agent_trips_passenger_list_retrieve
      description: GET /agent/trips/{id}/passenger-list/ — passagers d'un voyage (agent).
      parameters:
      - in: path
        name: trip_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passenger'
          description: ''
  /api/v1/agent/trips/today/:
    get:
      operationId: v1_agent_trips_today_list
      description: |-
        Voyages de la gare/vehicule de l'agent connecte pour une date donnee.

        Le parametre optionnel ``date`` (``YYYY-MM-DD``) permet de consulter un
        autre jour que la journee en cours (defaut). Alimente le selecteur de
        jour de l'ecran « Programme de la semaine » (guichet et controleur).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripRead'
          description: ''
  /api/v1/auth/company/register/:
    post:
      operationId: v1_auth_company_register_create
      description: Demande publique d'inscription d'une compagnie (statut ``pending``).
      summary: Deposer une demande de creation de compte compagnie
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRegistrationRequest'
            examples:
              Requete:
                value:
                  company_name: Transport Sahel
                  manager_name: Awa Ouedraogo
                  phone: '+22670000000'
                  email: contact@sahel.bf
                  city: Ouagadougou
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRequestStatus'
              examples:
                DemandeEnregistree:
                  value:
                    id: 12
                    company_name: Transport Sahel
                    manager_name: Awa Ouedraogo
                    phone: '+22670000000'
                    email: contact@sahel.bf
                    city: Ouagadougou
                    status: pending
                    created_at: '2026-07-21T10:00:00Z'
                  summary: Demande enregistree
          description: ''
        '400':
          description: Champs manquants, telephone invalide ou nom deja utilise.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransBookingTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransBookingTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransBookingTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransBookingTokenObtainPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: v1_auth_password_change_create
      description: Changement du mot de passe de l'utilisateur authentifie.
      summary: Changer son mot de passe
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            examples:
              Requete:
                value:
                  old_password: ancienMotDePasse1
                  new_password: nouveauMotDePasse1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                Succes:
                  value:
                    detail: Mot de passe modifie avec succes.
          description: ''
        '400':
          description: Ancien mot de passe incorrect ou nouveau mot de passe non conforme.
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: v1_bookings_list
      description: Reservations du voyageur connecte.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingReadList'
          description: ''
    post:
      operationId: v1_bookings_create
      description: Reservations du voyageur connecte.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: v1_bookings_retrieve
      description: Reservations du voyageur connecte.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      description: Reservations du voyageur connecte.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
