    NotificationSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
        type:
          allOf:
          - $ref: '#/components/schemas/Type6f3Enum'
          description: |-
            Valeur technique du type (mapping icone/couleur cote client).

            * `booking` - Reservation
            * `payment` - Paiement
            * `parcel` - Colis
            * `claim` - Reclamation
            * `review` - Avis
            * `trip` - Voyage
            * `message` - Message
            * `system` - Systeme
        type_display:
          type: string
          nullable: true
          description: Libelle FR du type, si disponible.
      required:
      - body
      - created_at
      - id
      - is_read
      - title
      - type
      - type_display
    NullEnum:
      enum:
      - null
    OfflineBooking:
      type: object
      description: |-
        Reservation saisie hors ligne par un agent guichet.

        Le `ticket_number` est genere localement par l'agent ; il sert de cle
        d'idempotence cote serveur (cf. business_rules.md §6).
      properties:
        ticket_number:
          type: string
          maxLength: 20
        trip_id:
          type: integer
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        seat_number:
          type: string
          maxLength: 10
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_method:
          type: string
          maxLength: 20
        transaction_ref:
          type: string
          nullable: true
          maxLength: 100
        baggage:
          type: array
          items:
            $ref: '#/components/schemas/BaggageWrite'
        offline_created_at:
          type: string
          format: date-time
      required:
      - first_name
      - last_name
      - offline_created_at
      - phone
      - ticket_number
      - trip_id
    OfflineBookingRead:
      type: object
      description: Reservation embarquee dans le paquet hors ligne (donnees minimales).
      properties:
        id:
          type: integer
          readOnly: true
        ticket_number:
          type: string
          maxLength: 20
        trip_id:
          type: integer
          readOnly: true
        passenger_name:
          type: string
          readOnly: true
        phone:
          type: string
          maxLength: 30
        seat_number:
          type: string
          maxLength: 10
        qr_code:
          type: string
        status:
          $ref: '#/components/schemas/StatusEe3Enum'
      required:
      - id
      - passenger_name
      - phone
      - seat_number
      - ticket_number
      - trip_id
    OfflineCancellation:
      type: object
      description: |-
        Annulation d'un billet au guichet, enregistree hors ligne (cf. requetes agent §1).

        Ne concerne qu'un billet **deja synchronise** avant la coupure (un billet cree
        hors ligne et jamais synchronise est simplement retire de l'outbox cote
        client, sans appel serveur).
      properties:
        ticket_number:
          type: string
          maxLength: 20
        reason:
          type: string
          default: ''
        offline_created_at:
          type: string
          format: date-time
      required:
      - offline_created_at
      - ticket_number
    OfflineParcel:
      type: object
      description: Colis enregistre hors ligne par un agent guichet.
      properties:
        tracking_number:
          type: string
          maxLength: 20
        origin_city:
          type: integer
        destination_city:
          type: integer
        destination_station:
          type: integer
          nullable: true
        trip:
          type: integer
          nullable: true
        sender_name:
          type: string
          maxLength: 150
        sender_phone:
          type: string
          maxLength: 30
        recipient_name:
          type: string
          maxLength: 150
        recipient_phone:
          type: string
          maxLength: 30
        description:
          type: string
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        offline_created_at:
          type: string
          format: date-time
      required:
      - destination_city
      - offline_created_at
      - origin_city
      - recipient_name
      - recipient_phone
      - sender_name
      - sender_phone
      - tracking_number
      - weight_kg
    OfflineParcelNotification:
      type: object
      description: |-
        « Marquer prevenu » d'un colis, enregistre hors ligne par un agent.

        Seul l'appel manuel (`call`) est synchronisable : un SMS ne peut pas partir
        hors ligne, l'app ne doit jamais laisser croire qu'un SMS a ete envoye.
        Le couple (`tracking_number`, `offline_created_at`) sert de cle d'idempotence.
      properties:
        tracking_number:
          type: string
          maxLength: 20
        method:
          allOf:
          - $ref: '#/components/schemas/OfflineParcelNotificationMethodEnum'
          default: call
        offline_created_at:
          type: string
          format: date-time
      required:
      - offline_created_at
      - tracking_number
    OfflineParcelNotificationMethodEnum:
      enum:
      - call
      type: string
      description: '* `call` - Appel manuel'
    OfflineParcelRead:
      type: object
      description: Colis en attente de remise expose pour le travail hors ligne.
      properties:
        tracking_number:
          type: string
          maxLength: 20
        recipient_name:
          type: string
          maxLength: 150
        recipient_phone:
          type: string
          maxLength: 30
        destination_city:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status62aEnum'
      required:
      - destination_city
      - recipient_name
      - recipient_phone
      - tracking_number
    OfflineTrip:
      type: object
      description: Voyage du jour expose pour le travail hors ligne.
      properties:
        id:
          type: integer
          readOnly: true
        origin_city:
          type: string
          readOnly: true
        destination_city:
          type: string
          readOnly: true
        departure_time:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        available_seats:
          type: integer
          maximum: 2147483647
          minimum: 0
        vehicle:
          type: string
          readOnly: true
        vehicle_type:
          type: string
          nullable: true
          readOnly: true
        total_seats:
          type: integer
          readOnly: true
        seat_plan:
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusF60Enum'
        driver_name:
          type: string
          maxLength: 150
        driver_phone:
          type: string
          maxLength: 30
      required:
      - departure_time
      - destination_city
      - id
      - origin_city
      - registration_closes_at
      - seat_plan
      - total_seats
      - vehicle
      - vehicle_type
    OfflineValidation:
