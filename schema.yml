components:
  schemas:
    ActivityLog:
      type: object
      description: Entree du journal d'audit (lecture super admin).
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        user_name:
          type: string
          readOnly: true
        user_role:
          type: string
          nullable: true
          readOnly: true
        action:
          type: string
          maxLength: 100
        entity_type:
          type: string
          maxLength: 50
        entity_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        details:
          nullable: true
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
      - user_name
      - user_role
    AgentActivity:
      type: object
      properties:
        agent_name:
          type: string
        bookings_today:
          type: integer
        parcels_today:
          type: integer
      required:
      - agent_name
      - bookings_today
      - parcels_today
    AgentBookingCancel:
      type: object
      description: Annulation d'un billet au guichet (motif libre, cf. requetes agent
        §1).
      properties:
        reason:
          type: string
          default: ''
    AgentBookingCreate:
      type: object
      description: |-
        Enregistrement d'un passager au guichet (mode hors ligne supporte).

        L'agent encaisse au guichet : la reservation est creee au statut `paid`.
        `transaction_ref` est requis pour les paiements non-especes.
      properties:
        trip:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        id_type:
          allOf:
          - $ref: '#/components/schemas/IdTypeEnum'
          default: none
        id_number:
          type: string
        seat_number:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_method:
          type: string
        transaction_ref:
          type: string
        discount_code:
          type: string
        ticket_number:
          type: string
        is_offline:
          type: boolean
          default: false
        offline_created_at:
          type: string
          format: date-time
          nullable: true
        baggage:
          type: array
          items:
            $ref: '#/components/schemas/BaggageWrite'
      required:
      - first_name
      - last_name
      - payment_method
      - phone
      - trip
    AgentDashboard:
      type: object
      properties:
        next_departures:
          type: array
          items:
            $ref: '#/components/schemas/AgentDeparture'
        pending_alerts:
          type: integer
        connection_status:
          type: string
        today_stats:
          $ref: '#/components/schemas/AgentTodayStats'
      required:
      - connection_status
      - next_departures
      - pending_alerts
      - today_stats
    AgentDeparture:
      type: object
      properties:
        trip_id:
          type: integer
        origin:
          type: string
        destination:
          type: string
        departure_time:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        available_seats:
          type: integer
        passenger_count:
          type: integer
        vehicle_type:
          type: string
          nullable: true
        total_seats:
          type: integer
      required:
      - available_seats
      - departure_time
      - destination
      - origin
      - passenger_count
      - registration_closes_at
      - total_seats
      - trip_id
      - vehicle_type
    AgentOfflineData:
      type: object
      description: |-
        Reponse de `GET /api/v1/agent/offline-data/` : paquet de travail du jour.

        Enveloppe les trois listes du paquet hors ligne (voyages du jour,
        reservations associees, colis en attente de remise) dans un objet unique.
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/OfflineTrip'
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/OfflineBookingRead'
        parcel_arrivals:
          type: array
          items:
            $ref: '#/components/schemas/OfflineParcelRead'
      required:
      - bookings
      - parcel_arrivals
      - trips
    AgentParcelCreate:
      type: object
      description: |-
        Enregistrement d'un colis au guichet (mode hors ligne supporte).

        La compagnie et la gare de depart sont deduites du profil agent dans la vue.
        Le tarif et le `tracking_number` sont calcules par le service, jamais fournis
        par le client (sauf `tracking_number` en mode hors ligne).
      properties:
        origin_city:
          type: integer
        destination_city:
          type: integer
        destination_station:
          type: integer
          nullable: true
        trip:
          type: integer
          nullable: true
        sender_name:
          type: string
        sender_phone:
          type: string
        recipient_name:
          type: string
        recipient_phone:
          type: string
        description:
          type: string
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        tracking_number:
          type: string
        is_offline:
          type: boolean
          default: false
        offline_created_at:
          type: string
          format: date-time
          nullable: true
      required:
      - destination_city
      - origin_city
      - recipient_name
      - recipient_phone
      - sender_name
      - sender_phone
      - weight_kg
    AgentPayment:
      type: object
      description: 'Encaissement au guichet : especes en une etape, Mobile Money par
        OTP.'
      properties:
        booking_id:
          type: integer
        method:
          $ref: '#/components/schemas/Method80cEnum'
        transaction_ref:
          type: string
          default: ''
        phone:
          type: string
          default: ''
      required:
      - booking_id
      - method
    AgentTodayStats:
      type: object
      description: Bloc « Indicateurs du jour » du tableau de bord agent desktop.
      properties:
        passengers_registered:
          type: integer
        passengers_registered_yesterday:
          type: integer
        parcels_registered:
          type: integer
        parcels_registered_yesterday:
          type: integer
        upcoming_departures:
          type: integer
        upcoming_departures_yesterday:
          type: integer
      required:
      - parcels_registered
      - parcels_registered_yesterday
      - passengers_registered
      - passengers_registered_yesterday
      - upcoming_departures
      - upcoming_departures_yesterday
    Baggage:
      type: object
      description: Lecture d'un bagage enregistre (ecran « Bagages » du voyageur).
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 100
        tag:
          type: string
          maxLength: 30
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
        location:
          $ref: '#/components/schemas/LocationEnum'
        location_display:
          type: string
          readOnly: true
      required:
      - id
      - label
      - location_display
      - tag
      - weight_kg
    BaggageWrite:
      type: object
      description: Enregistrement d'un bagage pese au guichet (imbrique dans la reservation).
      properties:
        label:
          type: string
          maxLength: 100
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
        location:
          allOf:
          - $ref: '#/components/schemas/LocationEnum'
          default: hold
      required:
      - label
      - weight_kg
    BlankEnum:
      enum:
      - ''
    BoardingValidation:
      type: object
      description: Lecture d'un embarquement.
      properties:
        id:
          type: integer
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        passenger_name:
          type: string
          readOnly: true
        method:
          $ref: '#/components/schemas/BoardingValidationMethodEnum'
        method_display:
          type: string
