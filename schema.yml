  /api/v1/payments/:
    get:
      operationId: v1_payments_list
      description: Liste paginee des paiements visibles par l'utilisateur courant.
        Un voyageur ne voit que les paiements de ses propres reservations (reference
        de transaction et telephone masques). Tri par date decroissante.
      summary: Lister mes paiements
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
