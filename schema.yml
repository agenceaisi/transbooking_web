      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentReadList'
          description: ''
    post:
      operationId: v1_payments_create
      description: 'Mobile Money : ouvre la transaction chez l''operateur, envoie
        un code de confirmation au payeur et renvoie le paiement au statut `otp_required`.
        Especes : le paiement reste `pending` jusqu''a l''encaissement au guichet.
        Carte : hors perimetre (400).'
      summary: Initier un paiement
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiate'
            examples:
              RequeteMobileMoney:
                value:
                  booking_id: 42
                  method: orange_money
                  phone: '+22670000001'
                summary: Requete Mobile Money
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentInitiate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentInitiate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRead'
              examples:
                Reponse:
                  value:
                    id: 7
                    ticket_number: BF2026001234
                    amount: '5000.00'
                    method: orange_money
                    method_display: Orange Money
                    status: otp_required
                    status_display: Code de confirmation attendu
                    transaction_ref: ''
                    phone: '****0001'
                    otp_expires_at: '2026-07-21T09:17:00Z'
                    otp_attempts_remaining: 3
                    receipt_url: ''
                    paid_at: null
                    created_at: '2026-07-21T09:12:00Z'
          description: ''
        '400':
          description: Champ manquant, moyen desactive ou hors perimetre.
        '409':
          description: Reservation deja reglee.
