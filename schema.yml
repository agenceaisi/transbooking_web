          items:
            $ref: '#/components/schemas/OfflineCancellation'
    SyncResult:
      type: object
      description: |-
        Reponse de `POST /api/v1/agent/sync/` (cf. business_rules.md §6).

        Attention : ``conflicts`` et ``errors`` decrivent les descripteurs
        transitoires renvoyes par la synchronisation, PAS le schema du modele
        ``SyncConflict`` (celui-ci est expose par `GET /agent/sync/conflicts/`).
      properties:
        synced:
          allOf:
          - $ref: '#/components/schemas/SyncSyncedCounts'
          readOnly: true
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/SyncResultConflict'
          readOnly: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SyncResultError'
          readOnly: true
      required:
      - conflicts
      - errors
      - synced
    SyncResultConflict:
      type: object
      description: |-
        Conflit de siege resolu automatiquement, renvoye par `POST /agent/sync/`.

        Seuls les conflits de siege reattribues apparaissent dans ``conflicts`` : ils
        sont toujours resolus (le prochain siege libre a ete attribue). Les rejets
        (voyage complet, voyage indisponible, donnee invalide) partent dans
        ``errors`` (cf. business_rules.md §6).
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/TypeD05Enum'
          description: |-
            Code du conflit ; toujours `seat_conflict` dans `conflicts`.

            * `seat_conflict` - Conflit de siege
            * `trip_full` - Voyage complet
            * `trip_unavailable` - Voyage indisponible
            * `duplicate` - Doublon ignore
            * `invalid` - Donnee invalide
        ticket_number:
          type: string
          description: Reference fonctionnelle de la reservation corrigee.
        original_seat:
          type: string
          description: Siege demande hors ligne.
        assigned_seat:
          type: string
          description: Siege reattribue automatiquement (a appliquer localement).
        message:
          type: string
          description: Explication en francais clair.
      required:
      - assigned_seat
      - message
      - original_seat
      - ticket_number
      - type
    SyncResultError:
      type: object
      description: |-
        Enregistrement rejete lors d'une synchronisation (`POST /agent/sync/`).

        Un enregistrement est rejete lorsqu'il ne peut pas etre integre : voyage
        complet/indisponible ou donnee invalide. L'ecriture locale correspondante
        doit etre marquee en echec cote agent.
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/TypeD05Enum'
          description: |-
            Motif du rejet (`trip_full`, `trip_unavailable`, `invalid`...).

            * `seat_conflict` - Conflit de siege
            * `trip_full` - Voyage complet
            * `trip_unavailable` - Voyage indisponible
            * `duplicate` - Doublon ignore
            * `invalid` - Donnee invalide
        entity:
          allOf:
          - $ref: '#/components/schemas/EntityEnum'
          description: |-
            Type d'enregistrement rejete (`booking`/`parcel`/`validation`).

            * `booking` - Reservation
            * `parcel` - Colis
            * `validation` - Embarquement
        reference:
          type: string
          description: Reference fonctionnelle (`ticket_number`/`tracking_number`).
        message:
          type: string
          description: Explication en francais clair.
      required:
      - entity
      - message
      - reference
      - type
    SyncSyncedCounts:
      type: object
      description: Compteurs d'enregistrements integres a la synchronisation.
      properties:
