    TripSummary:
      type: object
      description: Resume d'un voyage embarque dans le detail d'une reservation.
      properties:
        id:
          type: integer
          readOnly: true
        origin_city:
          type: string
          readOnly: true
        destination_city:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        company_sigle:
          type: string
          readOnly: true
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/StatusF60Enum'
      required:
      - company_name
      - company_sigle
      - departure_time
      - destination_city
      - id
      - origin_city
    TripWrite:
      type: object
      description: |-
        Creation/modification d'un voyage par le company admin.

        `available_seats` est initialise depuis `vehicle.total_seats` a la creation
        et n'est jamais fixe manuellement. `price` reprend `route.base_price` si non
        fourni.
      properties:
        id:
          type: integer
          readOnly: true
        route:
          type: integer
        vehicle:
          type: integer
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusF60Enum'
        cancellation_reason:
          type: string
          readOnly: true
      required:
      - cancellation_reason
      - departure_time
      - id
      - route
      - vehicle
    Type6f3Enum:
      enum:
      - booking
      - payment
      - parcel
      - claim
      - review
      - trip
      - message
      - system
      type: string
      description: |-
        * `booking` - Reservation
        * `payment` - Paiement
        * `parcel` - Colis
        * `claim` - Reclamation
        * `review` - Avis
        * `trip` - Voyage
        * `message` - Message
        * `system` - Systeme
    TypeD05Enum:
      enum:
      - seat_conflict
      - trip_full
      - trip_unavailable
      - duplicate
      - invalid
      type: string
      description: |-
        * `seat_conflict` - Conflit de siege
        * `trip_full` - Voyage complet
        * `trip_unavailable` - Voyage indisponible
        * `duplicate` - Doublon ignore
        * `invalid` - Donnee invalide
